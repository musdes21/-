<title>زاد المغترب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar, four views (home, spend, meals, shop). Calm green ground, gold reserved for savings. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface2:#E7ECE3; --ink:#13201A; --muted:#58695F; --line:#D7DDD3;
  --accent:#0B5D45; --on-accent:#FFFFFF; --accent-soft:#D6EBE1;
  --gold:#8F6209; --gold-soft:#F5EACB;
  --warn:#B3400F; --warn-soft:#F8DFD3; --amber:#9A6A0B; --amber-soft:#F5EACB;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 8px 24px rgba(19,32,26,.06);
    --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:var(--f-body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1511; --surface:#151F1A; --surface2:#1C2A23; --ink:#E7EFE9; --muted:#97AA9F; --line:#2A3A32;
    --accent:#47C493; --on-accent:#06251A; --accent-soft:#163B2D;
    --gold:#E3B556; --gold-soft:#2C2510;
    --warn:#F29267; --warn-soft:#3A1E12; --amber:#E3B556; --amber-soft:#2C2510;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#151F1A; --surface2:#1C2A23; --ink:#E7EFE9; --muted:#97AA9F; --line:#2A3A32;
  --accent:#47C493; --on-accent:#06251A; --accent-soft:#163B2D;
  --gold:#E3B556; --gold-soft:#2C2510;
  --warn:#F29267; --warn-soft:#3A1E12; --amber:#E3B556; --amber-soft:#2C2510;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6; direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:620px;margin:0 auto;padding-block:18px 132px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{width:38px;height:38px;flex:none;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 4px 12px rgba(11,93,69,.25)}
.mark svg{width:26px;height:26px}
.bn b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1;letter-spacing:-.01em}
.bn small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.foot{margin-top:34px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;padding-top:18px;border-top:1px solid var(--line)}
.foot .mark{width:30px;height:30px;border-radius:10px;box-shadow:none}
.foot .mark svg{width:20px;height:20px}
.ci{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.hero-card{background:linear-gradient(165deg,var(--accent-soft) 0%,var(--surface) 58%);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.hrow{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:156px;height:156px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.rt{stroke:var(--surface2)}
.rf{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.rf.amber{stroke:var(--amber)} .rf.warn{stroke:var(--warn)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc .label{font-size:12px}
.rc b{font-family:var(--f-display);font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.rc small{font-size:12px;color:var(--muted)}
.hstats{display:grid;gap:12px;min-width:0}
.hs .label{font-size:12px;display:block}
.hs b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2}
.hs small{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.hnote{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.hnote .pill{margin-top:0}
.hnote .label b{color:var(--ink)}
.qrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qrow .qchip{flex:none;background:var(--surface);display:flex;align-items:center;gap:6px;padding:8px 14px}
.qrow .qchip .ci{width:16px;height:16px;color:var(--accent)}
.sheet .add{background:none;border:0;box-shadow:none;padding:0}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-wrap{animation:fade .18s ease}
.sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}
.meal.now{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px;border-radius:14px;border-top-color:transparent}
.meal.now+.meal{border-top-color:transparent}
.cat-top span:first-child{display:flex;align-items:center;gap:10px}
.cat-top span:first-child .eic{width:30px;height:30px;border-radius:10px}
.cat-top span:first-child .ci{width:16px;height:16px}

.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.top h1{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3;margin-top:2px;text-wrap:balance}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg,.nav svg,.mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

section.block,div.block{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-family:var(--f-display);font-size:17px;font-weight:600}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0;text-decoration:none}

/* hero */
.hero{padding:4px 0 2px}
.label{font-size:14px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1.05;letter-spacing:-.02em}
.big small{font-size:20px;font-weight:500;color:var(--muted);margin-inline-start:6px;letter-spacing:0}
.sub{color:var(--muted);margin-top:6px}
.sub b{color:var(--ink);font-weight:600}
.track{position:relative;height:12px;border-radius:99px;background:var(--surface2);margin-top:16px;overflow:visible}
.fill{position:absolute;inset-block:0;right:0;border-radius:99px;background:var(--accent);min-width:6px;max-width:100%;transition:width .5s ease}
.fill.amber{background:var(--amber)} .fill.warn{background:var(--warn)}
.tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.track-legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-top:12px}
.pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

/* savings */
.save{background:var(--gold-soft);border-radius:18px;padding:16px;margin-top:20px}
.save-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.save h2{font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--gold)}
.save .amt{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--ink);line-height:1.2}
.save .amt small{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.save p.note{font-size:14px;color:var(--muted)}
input[type=range]{width:100%;margin:14px 0 2px;accent-color:var(--gold);direction:rtl}
.range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-soft)}
.btn.done{background:transparent;border-color:var(--gold);color:var(--gold)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.btn:active{transform:scale(.98)}

/* add form */
.add{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.amount-wrap{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount-wrap:focus-within{border-color:var(--accent)}
.amount-wrap input{flex:1;min-width:0;border:0;background:none;font-family:var(--f-display);font-size:30px;font-weight:600;outline:none;direction:ltr;text-align:right;padding:0}
.amount-wrap span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span,.qchip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500}
.qchip{cursor:pointer}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip span{white-space:nowrap}
.exp .mini{border:0;background:none}
.exp .v small{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.plancost{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-top .label{display:block}
.pc-top b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.pc-top small{color:var(--muted);font-size:14px}
.plancost .track{height:8px;margin-top:12px}
.plancost .btn{margin-top:12px}
.ctl{padding:12px 16px 4px}
.ss{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ss .label{display:block}
.ss b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.ss small{font-size:14px;color:var(--muted)}
details.prep>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;color:var(--accent)}
details.prep>summary::-webkit-details-marker{display:none}
details.prep>summary .cnt{font-family:var(--f-body);font-size:12px;font-weight:600;background:var(--surface);padding:2px 10px;border-radius:99px}
details.prep[open]>summary{margin-bottom:8px}
.qchip:hover{border-color:var(--accent)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick .qchip{padding:5px 12px;font-size:14px}
.quick .lbl{font-size:12px;color:var(--muted);align-self:center}
.row2{display:grid;grid-template-columns:1fr 150px;gap:10px;margin-top:14px}
.field{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.add .btn{margin-top:14px}

/* meals */
.meal{display:grid;grid-template-columns:36px 1fr 38px;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.eat{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent;transition:background .15s}
.eat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.eat[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.meal-main{background:none;border:0;padding:0;text-align:right;min-width:0;display:block}
.meal-main .slot{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.meal-main strong{display:block;font-weight:600;font-size:15px;line-height:1.4}
.meal-main .meta,.meal-main .needs{display:block;font-size:12px;color:var(--muted)}
.meal-main .needs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal.done .meal-main strong{text-decoration:line-through;color:var(--muted)}
.now-tag{font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);padding:0 7px;border-radius:99px}
.left-tag{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:0 7px;border-radius:99px}
.mini{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.mini:hover{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.day{margin-top:14px}
.day h3{font-family:var(--f-display);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.day.today .panel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface2);border-radius:14px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.toggle input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(-18px)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .label{font-size:12px}
.stat b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block}

/* prep */
.prep{background:var(--accent-soft);border-radius:18px;padding:14px 16px;margin-top:16px}
.prep h3{font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--accent)}
.prep .it{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--accent) 20%,transparent);cursor:pointer;align-items:start}
.prep .it:first-of-type{border-top:0}
.prep input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px}
.prep .it.got span{text-decoration:line-through;opacity:.6}
.prep p.sm{font-size:12px;color:var(--muted);margin-top:4px}

/* categories + week */
.cat{padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cat-top span:last-child{color:var(--muted);font-size:14px}
.cat .track{height:8px;margin-top:8px}
.weekcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-head .mid{text-align:center;min-width:0}
.wk-head .mid b{display:block;font-size:14px}
.wk-head .mid span{font-size:12px;color:var(--muted)}
.wk-sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:12px}
.wk-sum .v{font-family:var(--f-display);font-size:30px;font-weight:700}
.wk-sum .v small{font-size:14px;color:var(--muted);font-weight:500}
.wkwrap{position:relative;margin-top:12px}
.wkcols{display:flex;gap:6px}
.wcol{flex:1;min-width:0;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.wcol .plot{height:100px;display:flex;align-items:flex-end}
.wcol .bar{width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px;transition:height .4s ease}
.wcol .bar.over{background:var(--warn)} .wcol .bar.zero{background:var(--surface2)}
.wcol.future .bar{background:var(--surface2);opacity:.5}
.wcol .dl{height:26px;display:grid;place-items:center;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.wcol.sel .dl{background:var(--accent);color:var(--on-accent)}
.wcol.istoday .dl{outline:1.5px solid var(--accent)}
.wguide{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);opacity:.45;pointer-events:none}
.wk-detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.wk-detail .dh{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:2px}
.wk-note{font-size:12px;color:var(--muted);margin-top:8px}

/* spend list */
.group h3{font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 6px}
.exp{display:grid;grid-template-columns:38px 1fr auto 36px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.exp .t{min-width:0}
.exp .t b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.exp .t span{font-size:12px;color:var(--muted)}
.exp .v{font-family:var(--f-display);font-weight:600}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--amber-soft);color:var(--amber);padding:10px 14px;border-radius:14px;font-size:14px;margin-bottom:16px}
.demo .btn{flex:none}

/* shop */
.shop-sum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.shop-sum .big{font-size:40px}
.aisle h3{font-size:12px;font-weight:600;color:var(--muted);margin:20px 0 4px;letter-spacing:.02em}
.item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.item b{font-weight:600;display:block;line-height:1.35}
.item small{color:var(--muted);font-size:12px}
.item.got b{text-decoration:line-through;color:var(--muted)}
.item .p{font-weight:500;font-size:14px;color:var(--muted)}
.log{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.tips li{margin:0 0 8px;padding:0}
.tips{padding-inline-start:18px;margin:8px 0 0;color:var(--muted);font-size:14px}
.tips b{color:var(--ink)}
.af{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}

/* ---------- budget math ---------- */
function cycle(t){
  var D=S.settings.cycleDay||1;
  var start=new Date(t.getFullYear(),t.getMonth(),D);
  if(t<start)start=new Date(t.getFullYear(),t.getMonth()-1,D);
  var next=new Date(start.getFullYear(),start.getMonth()+1,D);
  var end=addDays(next,-1);
  return {start:start,end:end,days:diffDays(end,start)+1,left:diffDays(end,t)+1,elapsed:diffDays(t,start)+1,key:iso(start)};
}
function calc(){
  var t=today(),c=cycle(t),st=S.settings;
  var a=iso(c.start),b=iso(c.end);
  var list=S.expenses.filter(function(e){return e.date>=a&&e.date<=b});
  var spent=0,byCat={};CATS.forEach(function(x){byCat[x.id]=0});
  list.forEach(function(e){spent+=e.amt;byCat[e.cat]=(byCat[e.cat]||0)+e.amt});
  var budget=Math.max(0,st.salary-st.save);
  var remaining=budget-spent;
  var perDay=remaining>0?remaining/Math.max(1,c.left):0;
  var todaySpent=0,td=iso(t);list.forEach(function(e){if(e.date===td)todaySpent+=e.amt});
  return {t:t,c:c,list:list,spent:spent,byCat:byCat,budget:budget,remaining:remaining,perDay:perDay,todaySpent:todaySpent};
}

function weekData(off){
  var ws=addDays(wkStart(today()),off*7),days=[],tot=0,t=today();
  for(var i=0;i<7;i++){
    var d=addDays(ws,i),k=iso(d),list=S.expenses.filter(function(e){return e.date===k}),sum=list.reduce(function(a,e){return a+e.amt},0);
    tot+=sum;days.push({d:d,k:k,list:list,sum:sum,future:d>t,today:iso(d)===iso(t)});
  }

function mealCost(m){return m.need.reduce(function(a,x){var g=ING[x[0]];return a+g.p/g.u},0)}

  var mx={nocook:0,lazy:1,cook:2}[S.settings.mode],big=S.settings.freezer==='big';
  return MEALS.filter(function(m){return m.slot===slot&&m.e<=mx&&(big||!needsFreezer(m))&&(S.settings.airfryer||!m.af)});

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rollPlan(){
  var days=[],used={},carry=0,carryId=null;
  function pick(slot,i){
    var p=pool(slot);
    var recent=[];for(var k=Math.max(0,i-2);k<i;k++){var x=days[k][slot];if(x)recent.push(x.id)}
    var c=shuffle(p).filter(function(m){return (used[m.id]||0)<2&&recent.indexOf(m.id)<0});
    var m=c.length?c[0]:shuffle(p)[0];used[m.id]=(used[m.id]||0)+1;return m;
  }
  for(var i=0;i<7;i++){
    var day={b:{id:pick('b',i).id},d:{id:pick('d',i).id}};
    if(i===6&&S.settings.friday){day.l={id:'out'}}
    else if(carry>0){day.l={id:carryId,left:true};carry--}
    else{var m=pick('l',i);day.l={id:m.id};if(m.batch&&Math.random()<.9){carry=m.batch-1;carryId=m.id}}
    days.push(day);
  }
  return days;
}
function shopping(days,withExtra){
  var uses={},out=0;
  days.forEach(function(d){['b','l','d'].forEach(function(sl){var x=d[sl];if(x.id==='out'){out+=OUT;return}if(x.left)return;ids(MBY[x.id]).forEach(function(g){uses[g]=(uses[g]||0)+1})})});
  var items=[],pantry=[],total=0,pay=0;
  Object.keys(uses).forEach(function(id){
    var g=ING[id],u=uses[id];
    if(g.pantry){var c=u*g.p/g.u;total+=c;pantry.push({id:id,g:g,u:u,cost:g.p,part:c})}
    else{var packs=Math.ceil(u/g.u),c2=packs*g.p,sh=g.keep?u*g.p/g.u:c2;total+=sh;pay+=c2;items.push({id:id,g:g,u:u,packs:packs,cost:c2,part:sh})}
  });
  if(withExtra){Object.keys(S.extra).forEach(function(id){if(uses[id]||!ING[id])return;var g=ING[id];total+=g.p;pay+=g.p;items.push({id:id,g:g,u:1,packs:1,cost:g.p,part:g.p,extra:1})})}

}

function genPlan(){

    var p=rollPlan(),c=planCost(p),ok=c<=wk;
    var sc=ok?1e6+uniqMeals(p)*1000-c:-c;

function burst(el){
  if(!el||window.matchMedia('(prefers-reduced-motion: reduce)').matches||!el.animate)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#0B5D45','#47C493','#E8B84A','#F2D27A','#7BD3B0'];
  for(var i=0;i<22;i++){
    var c=document.createElement('span');c.className='confetti';c.style.left=cx+'px';c.style.top=cy+'px';c.style.background=cols[i%cols.length];document.body.appendChild(c);
    var a=Math.random()*Math.PI*2,d=60+Math.random()*90,dx=Math.cos(a)*d,dy=Math.sin(a)*d-40;
    var an=c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(dy+80)+'px) rotate('+(Math.random()*540)+'deg)',opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.8,.2,1)'});
    an.onfinish=(function(n){return function(){n.remove()}})(c);
  }
}

    var k=t.dataset.set;
    if(k==='friday'){S.settings.friday=t.checked}

    else if(k==='salary'){var v=num(t.value);if(!(v>=0))return;S.settings.salary=v;clampSave()}
    else if(k==='goal'){S.settings.goal=t.value.trim()||'التوفير'}

  }

  if(i===4)body='<div class="ill"><div class="sw-ill"><span>وضع بسيط</span><span class="sw"></span></div></div><h2>ابدأ بسيط</h2><p class="t">بدأنا لك بالوضع البسيط، وتقدر تفتح العرض الكامل أي وقت. وفيه باقات اختيارية لمن يبي مزايا زيادة.</p>';
  $('#ob').innerHTML='<div class="ob-in"><div class="ob-top"><button class="link" data-act="obskip">'+(i<N-1?'تخطّي':'')+'</button><div class="dots" aria-label="الخطوة '+(i+1)+' من '+N+'">'+[0,1,2,3,4].map(function(n){return '<i class="'+(n===i?'on':'')+'"></i>'}).join('')+'</div></div>'+
   '<div class="ob-slide" id="obSlide">'+body+'</div>'+
   '<div class="ob-actions">'+(i>0?'<button class="btn" data-act="obback">رجوع</button>':'')+'<button class="btn primary" style="flex:1" data-act="obnext">'+(i===N-1?'ابدأ':'التالي')+'</button></div></div>';
}
function obApply(){
  var d=obData(),sal=num(d.salary);
  if(sal>0)S.settings.salary=sal;
  S.settings.save=d.save;S.settings.goal=(d.goal||'').trim()||'الزواج';clampSave();
}
function obFinish(){obApply();S.onboarded=true;persist();$('#ob').hidden=true;document.body.style.overflow='';renderAll();toast('جاهز! نبدأ.')}
var MARKSVG='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10.5 12.5 16 7.5l5.5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="12.5" width="20" height="14" rx="4" fill="currentColor"/><circle cx="16" cy="19.5" r="3" fill="#E8B84A"/></svg>';

/* ---------- routing ---------- */
var VIEWS=['home','spend','meals','shop'];
function curView(){var h=location.hash.slice(1);return VIEWS.indexOf(h)<0?'home':h}
function route(){
  var h=curView();
  VIEWS.forEach(function(v){$('#v-'+v).hidden=(v!==h)});
  $$('.nav a').forEach(function(a){if(a.dataset.v===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var hr=new Date().getHours(),gm=hr<12?'صباح الخير':(hr<18?'مساء الخير':'مساء النور');
  var g={home:gm+'، هذا وضعك اليوم',spend:'سجل مصاريفك',meals:'وش تاكل هالأسبوع',shop:'وش تشتري من السوق'};
  $('#greet').textContent=g[h];
  var vv=$('#v-'+h);vv.classList.remove('enter');void vv.offsetWidth;vv.classList.add('enter');setTimeout(function(){vv.classList.remove('enter')},1200);setTimeout(function(){ui.seen[h]=true},1800);setTimeout(scanRv,60);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

renderAll();route();
if(!S.onboarded)setTimeout(obShow,350);
if(window.claude&&claude.use){claude.use('downloads').then(function(d){downloads=d}).catch(function(){})}
})();
</script>
